# Nodal 参考编排（PostgreSQL 16 + pgvector）。
# 本机没有 Docker，未做容器真机验证；首次使用请按 docs/DEPLOYMENT.md 的步骤核对。
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodal
      POSTGRES_USER: nodal
      POSTGRES_PASSWORD: change-me-in-prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodal -d nodal"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODAL_ENV: prod
      NODAL_HTTP_ADDR: :8080
      NODAL_DB_DRIVER: postgres
      NODAL_DB_DSN: "host=db user=nodal password=change-me-in-prod dbname=nodal port=5432 sslmode=disable"
      # 生产必须替换：>=32 位随机串 + 32 字节 base64/hex 密钥
      NODAL_JWT_SECRET: "replace-with-at-least-32-characters-secret"
      NODAL_ENC_KEY: "replace-with-32-byte-base64-or-64-hex"
      NODAL_CORS_ORIGINS: "http://localhost:8080"
      NODAL_STORAGE_DIR: /app/data/uploads
      NODAL_EMBED_MODEL: mock/embed
      NODAL_REPL_ENABLED: "false"
    volumes:
      - uploads:/app/data/uploads

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
